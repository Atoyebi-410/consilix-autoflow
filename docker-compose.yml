services:
  postgres:
    image: postgres:17
    container_name: consilix-autoflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: consilix-autoflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consilix-autoflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: consilix-autoflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data: